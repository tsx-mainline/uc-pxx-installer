name: Deploy installer page to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# one deploy at a time; don't cancel an in-progress deploy
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      # The install image is NOT in the repo. Pull it from the latest release
      # into the site at build time so the page fetches it same-origin (GitHub
      # release downloads are not CORS-fetchable from a browser).
      # The file names and the sha256 come from IMAGES in web/site/js/config.js,
      # the pins of the page itself, so a new pin needs no change here. A
      # download whose sha256 is not its pin fails the job before the upload:
      # the site never serves an image that the page would refuse.
      - name: Read the image pins from web/site/js/config.js
        run: |
          cp web/site/js/config.js "$RUNNER_TEMP/config.mjs"
          cat > "$RUNNER_TEMP/pins.mjs" <<'EOF'
          import { pathToFileURL } from "node:url";
          const { IMAGES } = await import(pathToFileURL(process.argv[2]).href);
          if (!Array.isArray(IMAGES) || IMAGES.length === 0) throw new Error("config.js: IMAGES is empty");
          const seen = new Set();
          for (const im of IMAGES) {
            if (typeof im.file !== "string" || !/^[A-Za-z0-9][A-Za-z0-9._-]*\.img$/.test(im.file))
              throw new Error(`config.js: bad image file name ${JSON.stringify(im.file)}`);
            if (typeof im.sha256 !== "string" || !/^[0-9a-f]{64}$/.test(im.sha256))
              throw new Error(`config.js: bad sha256 for ${im.file}`);
            if (seen.has(im.file)) throw new Error(`config.js: ${im.file} is pinned twice`);
            seen.add(im.file);
            console.log(`${im.sha256}  ${im.file}`);
          }
          EOF
          node "$RUNNER_TEMP/pins.mjs" "$RUNNER_TEMP/config.mjs" > "$RUNNER_TEMP/images.sha256"
          cat "$RUNNER_TEMP/images.sha256"
      - name: Fetch the pinned install images from the latest release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p web/site/images
          while read -r sha file; do
            gh release download --repo "$REPO" --pattern "$file" \
              --dir web/site/images --clobber || exit 1
          done < "$RUNNER_TEMP/images.sha256"
          ls -l web/site/images
      - name: Check the images against the pins (sha256)
        run: |
          cd web/site/images
          sha256sum --strict -c "$RUNNER_TEMP/images.sha256"
      # The mainline base (DESIGN-R23 M2) and the finish set (W12) are NOT in
      # the repo either: release assets, copied same-origin into the site
      # (web/site/base/uc-pxx-mainline/ and web/site/finish/) so the page
      # fetches them by itself. The pins come from config.js: the base's
      # manifest sha256 (BASE.manifest_sha256), then each of its two files by
      # the manifest; finish.json by FINISH.LISTS, then its two files by the
      # list. Any other byte fails the job before the upload.
      - name: Fetch and check the base and the finish set
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -o pipefail
          cp web/site/js/config.js "$RUNNER_TEMP/config.mjs"
          cat > "$RUNNER_TEMP/sets.mjs" <<'EOF'
          import { pathToFileURL } from "node:url";
          import { createHash } from "node:crypto";
          import { readFileSync } from "node:fs";
          const { BASE, FINISH } = await import(pathToFileURL(process.argv[2]).href);
          const [mode, dir] = process.argv.slice(3);
          const sha = (p) => createHash("sha256").update(readFileSync(p)).digest("hex");
          const hex = (s) => typeof s === "string" && /^[0-9a-f]{64}$/.test(s);
          if (mode === "assets") {
            for (const [name, asset] of Object.entries(BASE.assets)) console.log(`base ${asset} ${name}`);
            for (const name of ["finish.json", "uc-pxx-step2-finish", "uc-pxx-bootctl-inst"]) console.log(`finish ${name} ${name}`);
          } else if (mode === "base") {
            if (!hex(BASE.manifest_sha256)) throw new Error("config.js: the base is not pinned (BASE.manifest_sha256)");
            if (sha(`${dir}/manifest.json`) !== BASE.manifest_sha256) throw new Error("base manifest.json is not the pin");
            const m = JSON.parse(readFileSync(`${dir}/manifest.json`, "utf8"));
            for (const f of [m.boot_template, m.rootfs_zst]) {
              if (!f || !hex(f.sha256) || sha(`${dir}/${f.file}`) !== f.sha256 || readFileSync(`${dir}/${f.file}`).length !== f.size) throw new Error(`base ${f && f.file} is not the manifest's`);
            }
          } else if (mode === "finish") {
            const s = sha(`${dir}/finish.json`);
            if (!FINISH.LISTS.some((l) => l.sha256 === s)) throw new Error("finish.json is not pinned in FINISH.LISTS");
            const l = JSON.parse(readFileSync(`${dir}/finish.json`, "utf8"));
            for (const f of l.files) if (sha(`${dir}/${f.name}`) !== f.sha256 || readFileSync(`${dir}/${f.name}`).length !== f.size) throw new Error(`finish ${f.name} is not the list's`);
          }
          EOF
          mkdir -p web/site/base/uc-pxx-mainline web/site/finish "$RUNNER_TEMP/dl"
          node "$RUNNER_TEMP/sets.mjs" "$RUNNER_TEMP/config.mjs" assets | while read -r set asset name; do
            gh release download --repo "$REPO" --pattern "$asset" --dir "$RUNNER_TEMP/dl" --clobber || exit 1
            if [ "$set" = base ]; then mv "$RUNNER_TEMP/dl/$asset" "web/site/base/uc-pxx-mainline/$name"; else mv "$RUNNER_TEMP/dl/$asset" "web/site/finish/$name"; fi
          done
          node "$RUNNER_TEMP/sets.mjs" "$RUNNER_TEMP/config.mjs" base web/site/base/uc-pxx-mainline
          node "$RUNNER_TEMP/sets.mjs" "$RUNNER_TEMP/config.mjs" finish web/site/finish
          ls -l web/site/base/uc-pxx-mainline web/site/finish
      # The unlock client (tools/tee-unlock) is NOT in the repo either: it is a
      # release asset, pinned by UNLOCK.client in web/site/js/config.js. Pull it
      # same-origin into web/site/tools/ (like the image). The one-liner scripts
      # (*.sh, *.ps1) ARE in the repo and are served as-is. If the asset is not
      # in the latest release the deploy still succeeds (the page shows a
      # Releases-page fallback and the one-liner checks the sha either way).
      - name: Read the unlock-client pin from web/site/js/config.js
        run: |
          cp web/site/js/config.js "$RUNNER_TEMP/config.mjs"
          cat > "$RUNNER_TEMP/clientpin.mjs" <<'EOF'
          import { pathToFileURL } from "node:url";
          const { UNLOCK } = await import(pathToFileURL(process.argv[2]).href);
          const c = UNLOCK && UNLOCK.client;
          if (!c || typeof c.file !== "string" || !/^[A-Za-z0-9][A-Za-z0-9._-]*$/.test(c.file))
            throw new Error("config.js: bad UNLOCK.client.file");
          if (typeof c.sha256 !== "string" || !/^[0-9a-f]{64}$/.test(c.sha256))
            throw new Error("config.js: bad UNLOCK.client.sha256");
          console.log(`${c.sha256}  ${c.file}`);
          EOF
          node "$RUNNER_TEMP/clientpin.mjs" "$RUNNER_TEMP/config.mjs" > "$RUNNER_TEMP/client.sha256"
          cat "$RUNNER_TEMP/client.sha256"
      - name: Fetch the pinned unlock client from the latest release (optional)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p web/site/tools
          read -r sha file < "$RUNNER_TEMP/client.sha256"
          if gh release download --repo "$REPO" --pattern "$file" --dir web/site/tools --clobber; then
            ( cd web/site/tools && sha256sum --strict -c "$RUNNER_TEMP/client.sha256" )
          else
            echo "note: the unlock client '$file' is not in the latest release; the page uses the Releases-page fallback."
          fi
          ls -l web/site/tools
      - name: Upload web/site
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/site
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4

name: Deploy installer page to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# one deploy at a time; don't cancel an in-progress deploy
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      # The install image is NOT in the repo. Pull it from the latest release
      # into the site at build time so the page fetches it same-origin (GitHub
      # release downloads are not CORS-fetchable from a browser).
      # The file names and the sha256 come from IMAGES in web/site/js/config.js,
      # the pins of the page itself, so a new pin needs no change here. A
      # download whose sha256 is not its pin fails the job before the upload:
      # the site never serves an image that the page would refuse.
      - name: Read the image pins from web/site/js/config.js
        run: |
          cp web/site/js/config.js "$RUNNER_TEMP/config.mjs"
          cat > "$RUNNER_TEMP/pins.mjs" <<'EOF'
          import { pathToFileURL } from "node:url";
          const { IMAGES } = await import(pathToFileURL(process.argv[2]).href);
          if (!Array.isArray(IMAGES) || IMAGES.length === 0) throw new Error("config.js: IMAGES is empty");
          const seen = new Set();
          for (const im of IMAGES) {
            if (typeof im.file !== "string" || !/^[A-Za-z0-9][A-Za-z0-9._-]*\.img$/.test(im.file))
              throw new Error(`config.js: bad image file name ${JSON.stringify(im.file)}`);
            if (typeof im.sha256 !== "string" || !/^[0-9a-f]{64}$/.test(im.sha256))
              throw new Error(`config.js: bad sha256 for ${im.file}`);
            if (seen.has(im.file)) throw new Error(`config.js: ${im.file} is pinned twice`);
            seen.add(im.file);
            console.log(`${im.sha256}  ${im.file}`);
          }
          EOF
          node "$RUNNER_TEMP/pins.mjs" "$RUNNER_TEMP/config.mjs" > "$RUNNER_TEMP/images.sha256"
          cat "$RUNNER_TEMP/images.sha256"
      - name: Fetch the pinned install images from the latest release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p web/site/images
          while read -r sha file; do
            gh release download --repo "$REPO" --pattern "$file" \
              --dir web/site/images --clobber || exit 1
          done < "$RUNNER_TEMP/images.sha256"
          ls -l web/site/images
      - name: Check the images against the pins (sha256)
        run: |
          cd web/site/images
          sha256sum --strict -c "$RUNNER_TEMP/images.sha256"
      # The unlock client (tools/tee-unlock) is NOT in the repo either: it is a
      # release asset, pinned by UNLOCK.client in web/site/js/config.js. Pull it
      # same-origin into web/site/tools/ (like the image). The one-liner scripts
      # (*.sh, *.ps1) ARE in the repo and are served as-is. If the asset is not
      # in the latest release the deploy still succeeds (the page shows a
      # Releases-page fallback and the one-liner checks the sha either way).
      - name: Read the unlock-client pin from web/site/js/config.js
        run: |
          cp web/site/js/config.js "$RUNNER_TEMP/config.mjs"
          cat > "$RUNNER_TEMP/clientpin.mjs" <<'EOF'
          import { pathToFileURL } from "node:url";
          const { UNLOCK } = await import(pathToFileURL(process.argv[2]).href);
          const c = UNLOCK && UNLOCK.client;
          if (!c || typeof c.file !== "string" || !/^[A-Za-z0-9][A-Za-z0-9._-]*$/.test(c.file))
            throw new Error("config.js: bad UNLOCK.client.file");
          if (typeof c.sha256 !== "string" || !/^[0-9a-f]{64}$/.test(c.sha256))
            throw new Error("config.js: bad UNLOCK.client.sha256");
          console.log(`${c.sha256}  ${c.file}`);
          EOF
          node "$RUNNER_TEMP/clientpin.mjs" "$RUNNER_TEMP/config.mjs" > "$RUNNER_TEMP/client.sha256"
          cat "$RUNNER_TEMP/client.sha256"
      - name: Fetch the pinned unlock client from the latest release (optional)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p web/site/tools
          read -r sha file < "$RUNNER_TEMP/client.sha256"
          if gh release download --repo "$REPO" --pattern "$file" --dir web/site/tools --clobber; then
            ( cd web/site/tools && sha256sum --strict -c "$RUNNER_TEMP/client.sha256" )
          else
            echo "note: the unlock client '$file' is not in the latest release; the page uses the Releases-page fallback."
          fi
          ls -l web/site/tools
      - name: Upload web/site
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/site
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
